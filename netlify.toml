# Static single-page app — no build step required.
[build]
  publish = "."
  functions = "netlify/functions"

# Same-origin proxies to the Suno API so the browser never hits CORS issues.
# The user's API key travels in the Authorization header and is never stored server-side.
[[redirects]]
  from = "/suno/*"
  to = "https://api.sunoapi.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/suno-upload/*"
  to = "https://sunoapiorg.redpandaai.co/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.{js,css}"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
